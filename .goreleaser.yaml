builds:
  - id: speed-probe
    dir: .
    binary: speed-probe
    ldflags:
      - -s -w -X "main.COMMIT={{.Commit}}" -X "main.BUILDCOUNT={{.Env.BUILDCOUNT}}" -X "main.BRAND={{.Env.BRAND}}" -X "main.COMPILATIONTIME={{.Env.COMPILATIONTIME}}"
    goos:
      - darwin
      - linux
      - windows
archives:
  - files:
    - README.md
release:
  github:
    owner: silencoo
    name: speed-probe
